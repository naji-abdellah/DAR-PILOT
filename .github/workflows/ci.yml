name: CI Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Python Security & Tests ───────────────────────────────────────────
  python-security:
    name: Python Security & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit semgrep pip-audit

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --cov=backend --cov=ai --cov-report=xml --cov-report=term-missing
        env:
          DARPILOT_DB_PATH: /tmp/test.db
          DARPILOT_SECRET_KEY: test-secret-do-not-use-in-production
          DARPILOT_LOGIN_RATE_LIMIT: 100/minute
          DARPILOT_RAG_THRESHOLD: 0.60

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

      - name: Run Bandit (SAST)
        run: bandit -r backend/ ai/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json

      - name: Run Semgrep (SAST)
        run: semgrep --config=auto --json=semgrep-report.json backend/ ai/ || true
        continue-on-error: true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: backend/semgrep-report.json

      - name: Run pip-audit (Dependency scanning)
        run: pip-audit --format=json --output=pip-audit-report.json || true
        continue-on-error: true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json

  # ── Secret Scanning ───────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: "detect --source=. --verbose --redact"

  # ── Frontend Security & Tests ────────────────────────────────────────
  frontend-security:
    name: Frontend Security & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high --json > npm-audit-report.json || true
        continue-on-error: true

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Security Report Generation ────────────────────────────────────────
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [python-security, secret-scan, frontend-security]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Bandit report
        uses: actions/download-artifact@v4
        with:
          name: bandit-report
          path: artifacts/

      - name: Download Semgrep report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-report
          path: artifacts/

      - name: Download pip-audit report
        uses: actions/download-artifact@v4
        with:
          name: pip-audit-report
          path: artifacts/

      - name: Download npm audit report
        uses: actions/download-artifact@v4
        with:
          name: npm-audit-report
          path: artifacts/

      - name: Generate summary
        run: |
          echo "## Security Scan Summary" > security-summary.md
          echo "" >> security-summary.md
          echo "**Date:** $(date -u)" >> security-summary.md
          echo "**Commit:** ${{ github.sha }}" >> security-summary.md
          echo "" >> security-summary.md
          
          if [ -f artifacts/bandit-report.json ]; then
            HIGH=$(jq '.results | map(select(.severity=="HIGH")) | length' artifacts/bandit-report.json 2>/dev/null || echo 0)
            MEDIUM=$(jq '.results | map(select(.severity=="MEDIUM")) | length' artifacts/bandit-report.json 2>/dev/null || echo 0)
            LOW=$(jq '.results | map(select(.severity=="LOW")) | length' artifacts/bandit-report.json 2>/dev/null || echo 0)
            echo "### Bandit (Python SAST)" >> security-summary.md
            echo "- High: $HIGH" >> security-summary.md
            echo "- Medium: $MEDIUM" >> security-summary.md
            echo "- Low: $LOW" >> security-summary.md
            echo "" >> security-summary.md
          fi
          
          if [ -f artifacts/semgrep-report.json ]; then
            ERRORS=$(jq '.results | length' artifacts/semgrep-report.json 2>/dev/null || echo 0)
            echo "### Semgrep (SAST)" >> security-summary.md
            echo "- Findings: $ERRORS" >> security-summary.md
            echo "" >> security-summary.md
          fi
          
          if [ -f artifacts/pip-audit-report.json ]; then
            VULNS=$(jq '.vulnerabilities | length' artifacts/pip-audit-report.json 2>/dev/null || echo 0)
            echo "### pip-audit (Python deps)" >> security-summary.md
            echo "- Vulnerabilities: $VULNS" >> security-summary.md
            echo "" >> security-summary.md
          fi
          
          if [ -f artifacts/npm-audit-report.json ]; then
            VULNS=$(jq '.metadata.vulnerabilities // {} | .total // 0' artifacts/npm-audit-report.json 2>/dev/null || echo 0)
            echo "### npm audit (Node deps)" >> security-summary.md
            echo "- Vulnerabilities: $VULNS" >> security-summary.md
            echo "" >> security-summary.md
          fi
          
          cat security-summary.md

      - name: Upload security summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md

  # ── Notify on failure ─────────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [python-security, secret-scan, frontend-security]
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "::error::CI pipeline failed. Check the workflow logs for details."
          echo "Failed jobs: ${{ needs.python-security.result }}, ${{ needs.secret-scan.result }}, ${{ needs.frontend-security.result }}"